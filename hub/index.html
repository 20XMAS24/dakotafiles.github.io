<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Kentucky Hub</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Стиль «Sapphire»: графитовые карточки, лавандовый акцент, мягкое свечение, пилюли. */
:root{
  --bg:#141417; --bg-2:#1A1A1E;
  --panel:#1F1F24; --panel-2:#26262C; --panel-3:#2E2E35;
  --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.11);
  --text:#F4F3F8; --text-2:#A9A8B6; --muted:#76758A;
  --acc:#A98BFA; --acc-2:#C7B5FF; --acc-deep:#7C5CE6; --on-acc:#18122B;
  --acc-bg:rgba(169,139,250,.14); --acc-line:rgba(169,139,250,.42);
  --glow:rgba(124,92,230,.30);
  --red:#F97066; --ok:#7DD3A8; --warn:#F5B971; --info:#8DB6F8; --violet:#B9A3FF;
  --ok-bg:rgba(125,211,168,.12); --warn-bg:rgba(245,185,113,.12); --info-bg:rgba(141,182,248,.12);
  --red-bg:rgba(249,112,102,.12); --muted-bg:rgba(169,168,182,.10); --violet-bg:rgba(185,163,255,.14);
  --tldr-bg:rgba(169,139,250,.09); --tldr-line:#A98BFA;
  --hi-bg:#ECE6FF; --hi-fg:#2A2142;
  --shadow:0 24px 60px rgba(0,0,0,.5);
  --backdrop:rgba(8,8,12,.62);
  --f-display:'Manrope',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:22px; --r-sm:14px;
  --fs:15px; --pad:1;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEECF5; --bg-2:#F5F3FA;
    --panel:#FFFFFF; --panel-2:#F6F4FB; --panel-3:#ECE8F7;
    --line:rgba(30,20,60,.08); --line-2:rgba(30,20,60,.14);
    --text:#17141F; --text-2:#55516A; --muted:#86829A;
    --acc:#7C5CE6; --acc-2:#9B80F2; --acc-deep:#5B3CC4; --on-acc:#FFFFFF;
    --acc-bg:rgba(124,92,230,.10); --acc-line:rgba(124,92,230,.38); --glow:rgba(124,92,230,.16);
    --red:#D9473C; --ok:#1F8A5B; --warn:#A8630C; --info:#2F6FCF; --violet:#6A4BD6;
    --ok-bg:rgba(31,138,91,.10); --warn-bg:rgba(168,99,12,.10); --info-bg:rgba(47,111,207,.10);
    --red-bg:rgba(217,71,60,.09); --muted-bg:rgba(85,81,106,.08); --violet-bg:rgba(106,75,214,.10);
    --tldr-bg:rgba(124,92,230,.07); --tldr-line:#7C5CE6;
    --hi-bg:#2A2142; --hi-fg:#ECE6FF;
    --shadow:0 24px 60px rgba(40,30,80,.16); --backdrop:rgba(20,16,36,.40);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEECF5; --bg-2:#F5F3FA;
  --panel:#FFFFFF; --panel-2:#F6F4FB; --panel-3:#ECE8F7;
  --line:rgba(30,20,60,.08); --line-2:rgba(30,20,60,.14);
  --text:#17141F; --text-2:#55516A; --muted:#86829A;
  --acc:#7C5CE6; --acc-2:#9B80F2; --acc-deep:#5B3CC4; --on-acc:#FFFFFF;
  --acc-bg:rgba(124,92,230,.10); --acc-line:rgba(124,92,230,.38); --glow:rgba(124,92,230,.16);
  --red:#D9473C; --ok:#1F8A5B; --warn:#A8630C; --info:#2F6FCF; --violet:#6A4BD6;
  --ok-bg:rgba(31,138,91,.10); --warn-bg:rgba(168,99,12,.10); --info-bg:rgba(47,111,207,.10);
  --red-bg:rgba(217,71,60,.09); --muted-bg:rgba(85,81,106,.08); --violet-bg:rgba(106,75,214,.10);
  --tldr-bg:rgba(124,92,230,.07); --tldr-line:#7C5CE6;
  --hi-bg:#2A2142; --hi-fg:#ECE6FF;
  --shadow:0 24px 60px rgba(40,30,80,.16); --backdrop:rgba(20,16,36,.40);
  color-scheme:light;
}
:root[data-fs="s"]{--fs:14px} :root[data-fs="l"]{--fs:16.5px}
:root[data-density="compact"]{--pad:.7}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
body{color:var(--text);font:500 var(--fs)/1.55 var(--f-body);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:10px}
::selection{background:var(--acc-bg)}
.mono{font-family:var(--f-mono);font-size:.86em;font-variant-numeric:tabular-nums}
kbd{font:600 11px var(--f-mono);padding:2px 7px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--text-2)}

/* ── скроллбар: тонкий, лавандовый, появляется ярче при наведении ── */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--acc) 38%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--acc) 30%,transparent);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--acc) 70%,transparent);background-clip:padding-box;border-width:2px}
::-webkit-scrollbar-corner{background:transparent}

/* ── каркас ── */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100dvh;gap:0}
.side{position:sticky;top:0;height:100dvh;padding:14px 0 14px 14px}
.side-in{height:100%;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);
  background:radial-gradient(120% 50% at 50% 105%,var(--glow),transparent 70%),var(--panel);
  display:flex;flex-direction:column;gap:2px;padding:16px 12px}
.main{min-width:0;display:flex;flex-direction:column}
.wrap{max-width:1260px;width:100%;margin:0 auto;padding:calc(18px*var(--pad)) 22px 90px;display:flex;flex-direction:column;gap:calc(16px*var(--pad))}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,88vw);z-index:40;transform:translateX(-105%);transition:transform .22s;padding:10px}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block}
  .wrap{padding-inline:16px}
}
.scrim{display:none;position:fixed;inset:0;background:var(--backdrop);z-index:39}

.brand{display:flex;gap:11px;align-items:center;padding:2px 6px 10px}
.mark{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(140deg,var(--acc-2),var(--acc-deep));color:#fff;font:800 13px/1 var(--f-display);box-shadow:0 6px 20px var(--glow)}
.brand b{display:block;font:800 15.5px/1.2 var(--f-display);letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.nav-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.nav-h button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0;text-transform:none;letter-spacing:0}
.nav-h button:hover{color:var(--acc)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:calc(7px*var(--pad)) 10px;border-radius:12px;color:var(--text-2);text-decoration:none;font-size:14px;font-weight:600;position:relative;transition:background .12s,color .12s}
.nav a:hover{background:var(--panel-2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--panel-3);color:var(--text)}
.nav a[aria-current="page"] .ico{background:var(--hi-bg);color:var(--hi-fg)}
.nav .ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;flex:none;background:color-mix(in srgb,var(--dc,var(--acc)) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dc,var(--acc)) 22%,transparent)}
.nav .n{margin-left:auto;font:700 11px var(--f-mono);color:var(--muted)}
.nav .n.hot{color:var(--on-acc);background:var(--acc);padding:1px 7px;border-radius:99px}

.me-card{margin-top:auto;border:1px solid var(--acc-line);border-radius:18px;padding:13px;display:flex;flex-direction:column;gap:9px;
  background:radial-gradient(130% 120% at 100% 100%,var(--glow),transparent 65%),var(--panel-2)}
.me-row{display:flex;align-items:center;gap:10px}
.lvl{font:800 11px var(--f-display);padding:3px 9px;border-radius:99px;background:var(--acc);color:var(--on-acc)}
.streak{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.xpbar{height:6px;border-radius:4px;background:var(--panel-3);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc-deep),var(--acc-2));border-radius:4px;transition:width .5s}
.me-card small{color:var(--muted);font-size:11.5px}

/* ── верхняя полоса ── */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px)}
.topbar .in{max-width:1260px;margin:0 auto;padding:14px 22px 8px;display:flex;gap:10px;align-items:center}
@media (max-width:900px){.topbar .in{padding-inline:16px}}
.icon-btn.burger{display:none}
@media (max-width:900px){.icon-btn.burger{display:inline-grid}}
.search{flex:1 1 auto;min-width:0;max-width:540px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:9px 10px 9px 16px;color:var(--muted);cursor:pointer;font-size:14px;text-align:left;font-weight:500}
.search:hover{border-color:var(--acc-line)}
.search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.search kbd{display:none}}
.tb-sp{flex:1}
.faces{display:flex;align-items:center}
.faces .av{margin-left:-8px;box-shadow:0 0 0 2px var(--bg)}
.faces .av:first-child{margin-left:0}
.focus-pill{display:flex;align-items:center;gap:8px;border-radius:99px;padding:7px 14px;background:var(--acc-bg);color:var(--acc-2);font-size:13px;font-weight:700;border:1px solid var(--acc-line);cursor:pointer;white-space:nowrap}
.focus-pill .mono{font-size:12.5px}
@media (max-width:700px){.focus-pill .lbl,.btn.hide-sm{display:none}}
@media (max-width:480px){.faces .av:nth-child(n+3){display:none}}

/* ── кнопки ── */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:8px 15px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;line-height:1.2;text-decoration:none;color:var(--text);transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel-3);border-color:var(--line-2)}
.btn.primary{background:linear-gradient(180deg,var(--acc-2),var(--acc));color:var(--on-acc);border-color:transparent;box-shadow:0 6px 18px var(--glow)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--panel-2);border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--panel-3);color:var(--text)}
.btn.sm{padding:6px 13px;font-size:12.5px}
.icon-btn{border:0;background:var(--panel-2);color:var(--text-2);width:36px;height:36px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;font-size:15px;flex:none;transition:background .12s}
.icon-btn:hover{background:var(--panel-3);color:var(--text)}
.input,.select,textarea.input{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:9px 13px;font-size:14px;width:100%}
.input:focus,.select:focus,textarea.input:focus{outline:2px solid var(--acc-line);outline-offset:0;border-color:transparent}
.select{width:auto;border-radius:99px;padding-inline:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;line-height:1.35}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{color:var(--ok);background:var(--ok-bg)} .t-warn{color:var(--warn);background:var(--warn-bg)}
.t-info{color:var(--info);background:var(--info-bg)} .t-red{color:var(--red);background:var(--red-bg)}
.t-muted{color:var(--text-2);background:var(--muted-bg)} .t-violet{color:var(--violet);background:var(--violet-bg)}
.dchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px 3px 7px;border-radius:99px;background:color-mix(in srgb,var(--dc) 14%,transparent);color:color-mix(in srgb,var(--dc) 80%,var(--text));white-space:nowrap;border:0;cursor:pointer}
.size{font:700 10.5px var(--f-mono);padding:2px 7px;border-radius:99px;border:1px solid var(--line-2);color:var(--text-2)}
.av{width:26px;height:26px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font:800 10px var(--f-display);color:#fff;position:relative}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--panel)}
.av.focus::after{background:var(--acc)}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--panel-3);color:var(--text)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ── заголовок страницы ── */
.ph{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.ph-l{display:flex;gap:14px;align-items:center;min-width:0}
.ph-ico{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--dc,var(--acc)) 18%,var(--panel));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--dc,var(--acc)) 30%,transparent);flex:none}
.ph h1{margin:0;font:800 clamp(20px,2.4vw,26px)/1.2 var(--f-display);letter-spacing:-.02em}
.ph p{margin:3px 0 0;color:var(--text-2);font-size:13.5px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px;border-radius:99px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 15px;font-size:13.5px;font-weight:600;color:var(--text-2);cursor:pointer;border-radius:99px;white-space:nowrap;display:flex;gap:7px;align-items:center;text-decoration:none}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--hi-fg);background:var(--hi-bg)}
.tab .c{font:700 11px/1 var(--f-mono);padding:3px 6px;border-radius:99px;background:var(--panel-3);color:var(--text-2)}
.tab[aria-selected="true"] .c{background:color-mix(in srgb,var(--hi-fg) 14%,transparent);color:var(--hi-fg)}

/* ── TL;DR ── */
.tldr{border:1px solid var(--acc-line);background:radial-gradient(100% 140% at 0% 0%,var(--tldr-bg),transparent 70%),var(--panel);border-radius:var(--r-sm);padding:11px 15px;font-size:14px}
.tldr b{font:800 10.5px var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--acc);display:block;margin-bottom:2px}
details.more{border:1px solid var(--line);border-radius:var(--r-sm);padding:0 15px;background:var(--panel-2)}
details.more summary{cursor:pointer;padding:11px 0;font-size:13.5px;color:var(--text-2);font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.more summary::before{content:"▸";transition:transform .15s;color:var(--acc)}
details.more[open] summary::before{transform:rotate(90deg)}
details.more summary::-webkit-details-marker{display:none}
details.more .body{padding:0 0 14px;color:var(--text-2);font-size:14px;white-space:pre-wrap}

/* ── карточки ── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:calc(18px*var(--pad)) 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.glow{border-color:var(--acc-line);background:radial-gradient(90% 90% at 100% 100%,var(--glow),transparent 70%),var(--panel)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-h h2{margin:0;font:700 16px/1.3 var(--f-display);display:flex;gap:10px;align-items:center;letter-spacing:-.01em}
.panel-h .sub{color:var(--muted);font-size:12.5px}
.hi{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;background:var(--hi-bg);color:var(--hi-fg);font-size:15px;flex:none}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.today-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1050px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.g2,.g3,.today-grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

.item{display:flex;gap:12px;align-items:flex-start;padding:calc(12px*var(--pad)) 14px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(160deg,color-mix(in srgb,var(--dc,var(--acc)) 7%,var(--panel-2)),var(--panel-2) 60%);cursor:pointer;text-align:left;width:100%;color:var(--text);transition:border-color .12s,transform .12s}
.item:hover{border-color:var(--acc-line)}
.item .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.item .tt{font-weight:700;font-size:14px}
.item .ds{color:var(--text-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .mt{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.check{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);background:transparent;cursor:pointer;display:grid;place-items:center;color:transparent;margin-top:1px;font-size:12px}
.check:hover{border-color:var(--acc);color:var(--acc)}
.check.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.list{display:flex;flex-direction:column;gap:8px}

.hero{border-radius:var(--r);padding:22px 24px;border:1px solid var(--acc-line);
  background:radial-gradient(70% 140% at 100% 100%,var(--glow),transparent 70%),radial-gradient(60% 120% at 0% 0%,color-mix(in srgb,var(--acc) 10%,transparent),transparent 60%),var(--panel);
  display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.hero h1{margin:0;font:800 clamp(22px,2.8vw,30px)/1.15 var(--f-display);letter-spacing:-.02em}
.hero p{margin:6px 0 0;color:var(--text-2)}
.ring{--p:0;width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--panel-3) 0);display:grid;place-items:center;flex:none}
.ring span{width:62px;height:62px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:800 15px var(--f-display)}
.hero-stats{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hs{display:flex;flex-direction:column}
.hs b{font:800 24px/1.1 var(--f-display);letter-spacing:-.02em}
.hs small{color:var(--muted);font-size:12px}

.resume{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:12px 14px;background:var(--panel);flex-wrap:wrap}
.resume .bd{flex:1;min-width:180px}
.resume small{color:var(--muted);font-size:12px;display:block}
.resume b{font-weight:700}

.person{display:flex;gap:10px;align-items:center;padding:6px 0}
.person .bd{flex:1;min-width:0}
.person .nm{font-weight:700;font-size:14px}
.person .st{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .st.f{color:var(--acc)}

/* ── тепловая карта со штриховкой, как в референсе ── */
.heat{display:grid;grid-template-columns:auto repeat(14,minmax(0,1fr));gap:4px;align-items:center}
.heat .rl{font-size:11.5px;color:var(--text-2);font-weight:600;padding-right:6px;white-space:nowrap}
.heat .cl{font:600 10.5px var(--f-mono);color:var(--muted);text-align:center;padding-top:4px}
.cell{aspect-ratio:1;border-radius:6px;min-width:0;
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--acc) var(--a),transparent) 0 1.5px,transparent 1.5px 4px),color-mix(in srgb,var(--acc) calc(var(--a) / 3),var(--panel-2));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 14%,transparent)}
.cell.l0{--a:18%} .cell.l1{--a:40%} .cell.l2{--a:70%}
.cell.l3{background:var(--acc);box-shadow:0 0 12px var(--glow)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--acc)}

/* ── доска ── */
.board{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.colm{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.colm.drop{border-color:var(--acc);background:radial-gradient(100% 60% at 50% 100%,var(--glow),transparent 70%),var(--panel)}
.colm-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px;font-weight:700;font-size:13.5px}
.colm-h .n{font:700 11px var(--f-mono);color:var(--muted);margin-left:auto;background:var(--panel-2);padding:2px 8px;border-radius:99px}
.colm-h .dot{width:8px;height:8px;border-radius:50%}
.card{background:linear-gradient(170deg,color-mix(in srgb,var(--dc,var(--acc)) 9%,var(--panel-2)),var(--panel-2) 55%);border:1px solid var(--line);border-radius:16px;padding:12px 13px;display:flex;flex-direction:column;gap:8px;cursor:grab;position:relative}
.card:hover{border-color:var(--acc-line)}
.card.dragging{opacity:.45}
.card .tt{font-weight:700;font-size:13.5px;line-height:1.35}
.card .tl{font-size:12.5px;color:var(--text-2);line-height:1.4}
.card .mt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .mt .sp{flex:1}
.mini-bar{height:5px;background:var(--panel-3);border-radius:3px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc-deep),var(--acc-2));border-radius:3px}

/* ── решения ── */
.decision{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.decision h3{margin:0;font:700 16.5px/1.35 var(--f-display);letter-spacing:-.01em}
.opt{border:1px solid var(--line);border-radius:16px;padding:11px 13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--panel-2)}
.opt.chosen{border-color:var(--acc-line);background:radial-gradient(100% 140% at 100% 100%,var(--glow),transparent 70%),var(--panel-2)}
.opt.mine{border-color:var(--acc)}
.opt .l{font-weight:700}
.opt .d{color:var(--text-2);font-size:13px}
.votes{display:flex;align-items:center}
.votes .av{width:24px;height:24px;font-size:9px;margin-left:-6px;box-shadow:0 0 0 2px var(--panel-2)}
.votes .av:first-child{margin-left:0}
@media (max-width:640px){.opt{grid-template-columns:minmax(0,1fr)}}

/* ── реестры ── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.grid{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
table.grid th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 14px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:calc(11px*var(--pad)) 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.grid tr:last-child td{border-bottom:0}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover td{background:var(--panel-2)}
table.grid td.b{font-weight:700}
table.grid td.m{font-family:var(--f-mono);font-size:12.5px;color:var(--text-2)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;color:var(--text);transition:border-color .12s}
.tile:hover{border-color:var(--acc-line)}
.tile:nth-child(4n+3){border-color:var(--acc-line);background:radial-gradient(100% 100% at 100% 100%,var(--glow),transparent 70%),var(--panel)}
.tile .k{font-size:14px;font-weight:700;color:var(--text);display:flex;gap:9px;align-items:center}
.tile .k::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dc,var(--acc));box-shadow:0 0 0 5px color-mix(in srgb,var(--dc,var(--acc)) 18%,transparent);margin:0 4px 0 3px}
.tile .v{font:700 34px/1.05 var(--f-display);letter-spacing:-.03em;margin-top:6px}
.tile .s{font-size:12.5px;color:var(--text-2)}
.tile h3{margin:0;font:700 14.5px/1.35 var(--f-body)}
.thumb{height:118px;border-radius:14px;position:relative;overflow:hidden;background:radial-gradient(90% 120% at 100% 100%,var(--glow),transparent 70%),linear-gradient(135deg,color-mix(in srgb,var(--dc) 28%,var(--panel-3)),var(--panel-3))}
.thumb i{position:absolute;width:20px;height:20px;border-radius:50% 50% 50% 0;background:var(--acc);color:var(--on-acc);font:800 10px/20px var(--f-mono);text-align:center;font-style:normal;box-shadow:0 4px 10px var(--glow)}
.thumb .ui{position:absolute;inset:14px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.14)}
.thumb .ui::before{content:"";position:absolute;left:10px;top:10px;width:40%;height:8px;border-radius:4px;background:rgba(255,255,255,.32)}
.thumb .ui::after{content:"";position:absolute;left:10px;right:10px;bottom:10px;height:16px;border-radius:99px;background:color-mix(in srgb,var(--acc) 55%,transparent)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sw{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel-2)}
.sw div{height:58px}
.sw p{margin:0;padding:8px 11px;font-size:12px;font-weight:600}
.sw p span{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px;font-weight:400}
.cl{display:flex;flex-direction:column;gap:2px}
.cl label{display:flex;gap:11px;align-items:center;padding:9px 11px;border-radius:12px;cursor:pointer;font-size:14px}
.cl label:hover{background:var(--panel-2)}
.cl input{width:18px;height:18px;accent-color:var(--acc)}
.cl label.done span{color:var(--muted);text-decoration:line-through}
.timeline{display:flex;flex-direction:column;border-left:2px solid var(--line-2);margin-left:8px}
.tl-i{position:relative;padding:0 0 20px 22px}
.tl-i::before{content:"";position:absolute;left:-8px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--acc)}
.tl-i.cur::before{background:var(--acc);box-shadow:0 0 12px var(--glow)}
.tl-i h3{margin:0 0 4px;font:700 15px var(--f-display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-i p{margin:0;color:var(--text-2);font-size:13.5px}
.spark{width:100%;height:38px}

.log{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start;font-size:13.5px}
.entry:last-child{border-bottom:0}
.entry .when{font-size:12px;color:var(--muted);white-space:nowrap}
.entry q{quotes:"«" "»"}
.sub-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}

.empty{border:1px dashed var(--line-2);border-radius:18px;padding:20px;color:var(--text-2);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty b{color:var(--text)}

/* ── шторка карточки ── */
.drawer{position:fixed;top:10px;right:10px;bottom:10px;width:min(560px,calc(100vw - 20px));background:radial-gradient(80% 40% at 100% 100%,var(--glow),transparent 70%),var(--panel);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);z-index:45;display:flex;flex-direction:column;transform:translateX(110%);transition:transform .22s;overflow:hidden}
.drawer.open{transform:none}
.dr-h{display:flex;gap:12px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.dr-h h2{margin:0;font:700 17px/1.35 var(--f-display);flex:1;letter-spacing:-.01em}
.dr-b{padding:16px 18px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:9px 12px;font-size:13.5px;align-items:center}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.links{display:flex;flex-wrap:wrap;gap:6px}
.link{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line-2);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--panel-2);color:var(--text)}
.link:hover{border-color:var(--acc-line)}
.comment{display:flex;gap:10px;font-size:13.5px}
.comment .bd{background:var(--panel-2);border-radius:14px;padding:9px 12px;flex:1}
.comment small{color:var(--muted);font-size:11.5px}
.statusbar{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);align-self:flex-start}
.statusbar button{border:0;background:transparent;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer}
.statusbar button[aria-pressed="true"]{background:var(--hi-bg);color:var(--hi-fg)}

/* ── палитра, захват, настройки ── */
.overlay{position:fixed;inset:0;background:var(--backdrop);backdrop-filter:blur(3px);z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal{width:min(640px,100%);background:radial-gradient(80% 60% at 100% 100%,var(--glow),transparent 70%),var(--panel);border:1px solid var(--acc-line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.pal input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:18px 20px;font-size:16px;outline:none;width:100%;font-weight:600}
.pal-list{overflow-y:auto;padding:8px}
.pal-g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px;font-weight:700}
.pal-i{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600}
.pal-i[aria-selected="true"]{background:var(--panel-3)}
.pal-i .ico{width:24px;text-align:center}
.pal-i .r{margin-left:auto;color:var(--muted);font-size:12px;font-weight:500}
.pal-f{border-top:1px solid var(--line);padding:9px 16px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.cap{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.cap h2{margin:0;font:700 17px var(--f-display)}
.cap textarea{min-height:76px;resize:vertical}
.cap .hint{font-size:12.5px;color:var(--muted)}
.dpick{display:flex;flex-wrap:wrap;gap:6px}
.dpick .dchip{opacity:.5}
.dpick .dchip[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--dc)}
.settings{width:min(480px,100%)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.set-row small{display:block;color:var(--muted);font-size:12px;font-weight:500}

.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(160deg,var(--acc-2),var(--acc-deep));color:#fff;font-size:26px;cursor:pointer;box-shadow:0 12px 30px var(--glow);display:grid;place-items:center}
.fab:hover{filter:brightness(1.08)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:70;width:min(460px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--panel-3);border:1px solid var(--acc-line);border-radius:99px;padding:10px 18px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;animation:up .25s ease-out}
.toast .xp{margin-left:auto;font:800 12px var(--f-display);color:var(--acc-2)}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.proto{font-size:12.5px;color:var(--text-2);background:var(--panel);border:1px dashed var(--acc-line);border-radius:99px;padding:7px 8px 7px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.proto b{color:var(--acc)}
.confetti{position:fixed;pointer-events:none;z-index:80;width:8px;height:12px;border-radius:2px;animation:fall 1.1s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root[data-calm="1"] .confetti{display:none}
</style>

<script>
(() => {
'use strict';

/* ── люди ───────────────────────────────────── */
const NOW = Date.now();
const PEOPLE = {
  me:   {name:'Вы',     role:'Руководитель',        depts:['econ','gd'], color:'#7C5CE6'},
  rex:  {name:'Rex',    role:'Сервер, C#',          depts:['dev'],       color:'#4C6FB8', seen:NOW, focus:{task:'t2', until:NOW+18*60e3}},
  mira: {name:'Mira',   role:'UI/UX-дизайн',        depts:['design','cef'], color:'#A0558F', seen:NOW, focus:{task:'t5', until:NOW+9*60e3}},

  {id:'gd', name:'Геймдизайн', icon:'🎲', color:'#B9A3FF', tldr:'Механики, работы, квесты и фракции. Каждая механика описана карточкой: зачем, как работает, связанные параметры экономики.',

const D = Object.fromEntries(DEPTS.map(d=>[d.id,d]));

const COLS = [['inbox','Входящие','var(--muted)'],['todo','К работе','var(--info)'],['doing','В работе','var(--warn)'],['review','Ревью','var(--violet)'],['done','Готово','var(--ok)']];

/* ── состояние ──────────────────────────────── */
const KEY = 'kyHubProto';
const fresh = () => ({tasks:structuredClone(SEED_TASKS), decisions:structuredClone(SEED_DECISIONS), inbox:structuredClone(SEED_INBOX), log:structuredClone(SEED_LOG),
  checks:{}, xp:140, days:[dayKey(NOW-86400e3), dayKey(NOW-2*86400e3), dayKey(NOW-3*86400e3)], last:'t1', focus:null,
  prefs:{theme:'auto', calm:false, fs:'m', density:'normal', hidden:[]}, top3:['t1','t8','t14']});
function dayKey(t){ const d = new Date(t); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !S.tasks) S = fresh();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const UI = {route:'today', tab:null, filt:{dept:'all', small:false, mine:false}, drawer:null, pal:null};

/* ── утилиты ────────────────────────────────── */
const $ = (s,r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const task = id => S.tasks.find(t=>t.id===id);
const dec = id => S.decisions.find(d=>d.id===id);
const isOnline = id => id==='me' || (PEOPLE[id] && PEOPLE[id].seen > Date.now()-5*60e3);
const focusOf = id => id==='me' ? S.focus : (PEOPLE[id] && PEOPLE[id].focus && PEOPLE[id].focus.until > Date.now() ? PEOPLE[id].focus : null);
function av(id, size){
  const p = PEOPLE[id]; if (!p) return '';
  const cls = focusOf(id) ? 'av on focus' : isOnline(id) ? 'av on' : 'av';
  const s = size ? `width:${size}px;height:${size}px;` : '';
  return `<span class="${cls}" style="${s}background:${p.color}" title="${esc(p.name)}">${esc(p.name.slice(0,2).toUpperCase())}</span>`;
}
const dchip = id => { const d = D[id]; return d ? `<span class="dchip" role="link" tabindex="0" style="--dc:${d.color}" data-go="d/${d.id}">${d.icon} ${esc(d.name)}</span>` : ''; };
const chip = (s) => `<span class="chip dot t-${s.tone}">${esc(s.label)}</span>`;
const colName = id => (COLS.find(c=>c[0]===id)||[,id])[1];
const colTone = {inbox:'muted', todo:'info', doing:'warn', review:'violet', done:'ok'};
function ago(t){
  const d = Date.now()-t;
  if (d < 60e3) return 'только что';
  if (d < 3600e3) return Math.round(d/60e3)+' мин назад';
  if (d < 86400e3) return Math.round(d/3600e3)+' ч назад';
  return Math.round(d/86400e3)+' дн назад';
}
const mmss = ms => { const s = Math.max(0, Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const level = () => Math.floor(S.xp/100)+1;
function streak(){
  const set = new Set(S.days); let n = 0;
  for (let i=0;;i++) { const k = dayKey(Date.now()-i*86400e3); if (set.has(k)) n++; else if (i>0) break; }
  return n;
}
function weekDone(){ const t = Date.now()-7*86400e3; return S.tasks.filter(x=>x.status==='done' && (x.doneAt||0) > t).length; }
const WEEK_GOAL = 10;

/* ── геймификация ───────────────────────────── */
function gain(xp, text){
  const before = level();
  S.xp += xp;
  const k = dayKey(Date.now()); if (!S.days.includes(k)) S.days.push(k);
  save();
  toast(text, S.prefs.calm ? '' : '+'+xp+' XP');
  if (level() > before && !S.prefs.calm) { setTimeout(()=>toast('Новый уровень: '+level()+' 🎉',''), 500); confetti(innerWidth/2, innerHeight/2, 60); }
}
function confetti(x, y, n=28){
  if (S.prefs.calm || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#A98BFA','#C7B5FF','#7C5CE6','#ECE6FF','#F0A6CA','#8DB6F8'];
  for (let i=0;i<n;i++){
    const el = document.createElement('i'); el.className = 'confetti';
    const a = Math.random()*Math.PI*2, r = 60+Math.random()*140;
    el.style.cssText = `left:${x}px;top:${y}px;background:${colors[i%colors.length]};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r+120}px;--r:${Math.random()*720-360}deg`;
    document.body.appendChild(el); setTimeout(()=>el.remove(), 1200);
  }
}
function toast(text, xp){
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${text}</span>${xp?`<span class="xp">${esc(xp)}</span>`:''}`;
  $('#toasts').appendChild(el); setTimeout(()=>el.remove(), 3200);
}
function addLog(text, dept){ S.log.unshift({by:'me', text, at:Date.now(), dept}); if (S.log.length>200) S.log.length = 200; }

function heatmap(){
  const rows = DEPTS.filter(d=>!S.prefs.hidden.includes(d.id)).slice(0,6);
  let seed = 11; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  const days = Array.from({length:14},(_,i)=>new Date(Date.now()-(13-i)*86400e3).getDate());
  return `<section class="panel"><div class="panel-h"><h2><span class="hi">📈</span>Активность команды</h2><a class="btn sm ghost" href="#/log">Журнал</a></div>

  <div class="heat">${rows.map(d=>`<span class="rl" title="${esc(d.name)}">${d.icon} ${esc(d.name)}</span>`+days.map(()=>{ const v = rnd(); return `<span class="cell l${v>.86?3:v>.62?2:v>.3?1:0}"></span>`; }).join('')).join('')}<span></span>${days.map(n=>`<span class="cl">${n}</span>`).join('')}</div></section>`;
}

function spark(data, color){
  const w = 200, h = 36, mn = Math.min(...data), mx = Math.max(...data), r = mx-mn || 1;
  const pts = data.map((v,i)=>`${(i/(data.length-1)*w).toFixed(1)},${(h-3-(v-mn)/r*(h-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function registry(key, d){
  const r = REG[key]; if (!r) return '<div class="empty">Скоро.</div>';

  if (r.type==='cards') return `<div class="tiles">${r.items.map((c,i)=>`<button class="tile" data-open="card:${key}:${i}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3>${esc(c.t)}</h3>${chip(c.s)}</div><div class="s">${esc(c.tl)}</div></button>`).join('')}</div>`;
  if (r.type==='mockups') return `<div class="tiles">${r.items.map((c,i)=>`<button class="tile" data-open="card:${key}:${i}" style="--dc:${d.color}"><div class="thumb"><div class="ui"></div>${Array.from({length:c.pins},(_,k)=>`<i style="left:${18+k*17%70}%;top:${20+(k*29)%55}%">${k+1}</i>`).join('')}</div><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(c.t)}</h3>${chip(c.s)}</div><div class="s">${esc(c.tl)}</div><div style="display:flex;gap:8px;align-items:center">${av(c.who,22)}<small style="color:var(--muted)">📌 ${c.pins} комментариев на макете</small></div></button>`).join('')}</div>`;
  if (r.type==='tiles') return `<div class="tiles">${r.items.map(t=>`<div class="tile"><span class="k">${esc(t.k)}</span><span class="v">${esc(t.v)}</span><span class="s">${esc(t.s)}</span></div>`).join('')}</div>`;
  if (r.type==='metrics') return `<div class="tiles">${r.items.map(t=>`<div class="tile"><span class="k">${esc(t.k)}</span><span class="v">${esc(t.v)}</span>${spark(t.d, d.color)}<span class="s">${esc(t.s)}</span></div>`).join('')}</div>`;

    <div class="cl">${r.items.map((it,i)=>`<label class="${c[i]?'done':''}"><input type="checkbox" data-action="check" data-key="${key}" data-i="${i}" ${c[i]?'checked':''}><span>${esc(it)}</span></label>`).join('')}</div></section>`; }
  if (r.type==='timeline') return `<section class="panel"><div class="timeline" style="--dc:${d.color}">${r.items.map(t=>`<div class="tl-i${t.cur?' cur':''}"><h3>${esc(t.t)} ${chip(t.s)}</h3><p>${esc(t.tl)}</p></div>`).join('')}</div></section>`;
  if (r.type==='kit') { const sw = [['Акцент','#A98BFA'],['Светлый акцент','#C7B5FF'],['Глубокий акцент','#7C5CE6'],['Фон','#141417'],['Карточка','#1F1F24'],['Успех','#7DD3A8'],['Внимание','#F5B971'],['Ошибка','#F97066']];

  ].map(c=>({g:'Команды', ico:c[0], t:c[1], r:c[2], run:c[3]}));
  const pages = [['today','☀️','Мой день'],['inbox','📥','Входящие'],['tasks','🗂️','Задачи'],['decisions','⚖️','Решения'],['log','📜','Журнал'],['people','👥','Люди'],['wiki','📚','Вики']]
    .map(p=>({g:'Разделы', ico:p[1], t:p[2], run:()=>go(p[0])}))
    .concat(DEPTS.flatMap(d=>[{g:'Разделы', ico:d.icon, t:d.name, run:()=>go('d/'+d.id)}].concat(d.tabs.slice(1).map(([id,n])=>({g:'Разделы', ico:d.icon, t:d.name+' → '+n, run:()=>go('d/'+d.id+'/'+id)})))));
  const tasks = S.tasks.map(t=>({g:'Задачи', ico:D[t.dept].icon, t:t.title, r:colName(t.status), extra:t.tldr, run:()=>openDrawer('task:'+t.id)}));
  const decs = S.decisions.map(d=>({g:'Решения', ico:'⚖️', t:d.q, extra:d.tldr, run:()=>go('decisions')}));
  const wiki = WIKI.map(w=>({g:'Вики', ico:'📚', t:w.title, extra:w.tldr, run:()=>go('wiki')}));
  let all = [...cmds, ...pages, ...tasks, ...decs, ...wiki];
  if (q) all = all.filter(x=>(x.t+' '+(x.extra||'')).toLowerCase().includes(q));
  else all = [...cmds, ...pages.slice(0,7), ...tasks.filter(t=>true).slice(0,4)];
  return all.slice(0,40);
}
function palette(){
  UI.pal = {q:'', i:0, items:palItems('')};
  $('#overlay').innerHTML = `<div class="overlay" data-action="overlay-bg"><div class="pal" role="dialog" aria-label="Командная палитра"><input id="pal-in" placeholder="Найти задачу, раздел или команду…" autocomplete="off"><div class="pal-list" id="pal-list" role="listbox"></div><div class="pal-f"><span><kbd>↑</kbd><kbd>↓</kbd> выбрать</span><span><kbd>Enter</kbd> открыть</span><span><kbd>Esc</kbd> закрыть</span></div></div></div>`;
  paintPal(); $('#pal-in').focus();
}
function paintPal(){
  const P = UI.pal; let g = '', html = '';
  P.items.forEach((x,i) => { if (x.g!==g) { g = x.g; html += `<div class="pal-g">${g}</div>`; } html += `<div class="pal-i" role="option" data-pal="${i}" aria-selected="${i===P.i}"><span class="ico">${x.ico}</span><span>${esc(x.t)}</span>${x.r?`<span class="r">${esc(x.r)}</span>`:''}</div>`; });
  $('#pal-list').innerHTML = html || '<div class="pal-g">Ничего не нашлось. Enter — записать как мысль</div>';
  const sel = $('#pal-list [aria-selected="true"]'); if (sel) sel.scrollIntoView({block:'nearest'});
}
function runPal(i){
  const P = UI.pal; const x = P.items[i];
  if (!x) { if (P.q.trim()) { S.inbox.unshift({id:'i'+Date.now(), text:P.q.trim(), at:Date.now(), by:'me'}); closeOverlay(); gain(2,'💭 Записано во «Входящие»'); paint(); } return; }
  closeOverlay(); x.run();
}
function settings(){
  const p = S.prefs;
  const seg = (k, opts) => `<div class="seg">${opts.map(([v,n])=>`<button data-action="pref" data-k="${k}" data-v="${v}" aria-pressed="${p[k]===v}">${n}</button>`).join('')}</div>`;
  $('#overlay').innerHTML = `<div class="overlay" data-action="overlay-bg"><div class="pal settings" role="dialog" aria-label="Настройки"><div class="cap"><h2><span class="hi">⚙️</span>Настройки</h2>
    <div class="set-row"><div>Тема</div>${seg('theme',[['auto','Авто'],['dark','Тёмная'],['light','Светлая']])}</div>
    <div class="set-row"><div>Размер текста</div>${seg('fs',[['s','S'],['m','M'],['l','L']])}</div>
    <div class="set-row"><div>Плотность</div>${seg('density',[['normal','Свободно'],['compact','Плотно']])}</div>
    <div class="set-row"><div>Спокойный режим<small>Без конфетти и всплывашек XP. Прогресс остаётся.</small></div>${seg('calm',[[false,'Выкл'],[true,'Вкл']])}</div>
    <div><p class="sub-h" style="margin:10px 0 8px">Отделы в боковой панели</p><div class="dpick">${DEPTS.map(d=>`<button type="button" class="dchip" style="--dc:${d.color}" data-action="toggle-dept" data-d="${d.id}" aria-pressed="${!p.hidden.includes(d.id)}">${d.icon} ${esc(d.name)}</button>`).join('')}</div><small style="color:var(--muted)">Скрой то, чем не занимаешься. Меньше шума.</small></div>
    <div style="display:flex;justify-content:flex-end"><button class="btn" data-action="close-overlay">Готово</button></div></div></div></div>`;
}
function applyPrefs(){
  const r = document.documentElement, p = S.prefs;
  if (p.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', p.theme);
  r.setAttribute('data-fs', p.fs); r.setAttribute('data-density', p.density); r.setAttribute('data-calm', p.calm?'1':'0');
}

/* ── действия ───────────────────────────────── */
function setStatus(id, s, x, y){
  const t = task(id); if (!t || t.status===s) return;
  const was = t.status; t.status = s;
  if (s==='done') { t.doneAt = Date.now(); addLog(`закрыл(а) задачу <q>${esc(t.title)}</q>`, t.dept); confetti(x ?? innerWidth/2, y ?? innerHeight/2); gain(XP_BY_SIZE[t.size]||10, '✅ Готово: '+esc(t.title)); }
  else { if (was==='done') delete t.doneAt; addLog(`перевёл(а) <q>${esc(t.title)}</q> в «${colName(s)}»`, t.dept); save(); }
  paint(); paintDrawer();
}
function newTask(status, dept, title){
  UI.pal = null;
  dept = dept || (UI.route.startsWith('d/') ? UI.route.slice(2) : 'dev');
  $('#overlay').innerHTML = `<div class="overlay" data-action="overlay-bg"><form class="pal" data-form="task" data-status="${status||'todo'}">
    <div class="cap"><h2>＋ Новая задача</h2>
    <input class="input" name="title" placeholder="Что сделать? Начни с глагола: «Починить…», «Добавить…»" value="${esc(title||'')}" required autocomplete="off">
    <input class="input" name="tldr" placeholder="Суть в одном предложении — зачем это нужно" autocomplete="off">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <select class="select" name="dept" aria-label="Отдел">${DEPTS.map(d=>`<option value="${d.id}" ${d.id===dept?'selected':''}>${d.icon} ${esc(d.name)}</option>`).join('')}</select>
      <div class="seg" role="radiogroup" aria-label="Размер">${Object.entries(SIZES).map(([k,v])=>`<button type="button" data-action="pick-size" data-v="${k}" aria-pressed="${k==='M'}" title="${v}">${k} · ${v}</button>`).join('')}</div>
      <input type="hidden" name="size" value="M">
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="hint"><kbd>Enter</kbd> создать · <kbd>Esc</kbd> закрыть</span><span style="flex:1"></span><button class="btn primary">Создать</button></div></div>
  </form></div>`;
  $('#overlay [name="title"]').focus();
}
function createTask(f){
  const t = f.title.value.trim(); if (!t) return;
  const id = 't'+Date.now(), dept = f.dept.value;
  S.tasks.push({id, title:t, tldr:f.tldr.value.trim(), details:'', dept, status:f.dataset.status||'todo', size:f.size.value, who:'me', links:[], sub:[], comments:[]});
  closeOverlay();
  addLog(`создал(а) задачу <q>${esc(t)}</q>`, dept); gain(3, '＋ Задача создана'); paint(); openDrawer('task:'+id);
}
function startFocus(id){
  if (!id || !task(id)) { id = S.top3.find(x=>task(x) && task(x).status!=='done') || S.tasks.find(t=>t.status!=='done').id; }
  S.focus = {task:id, until:Date.now()+25*60e3}; S.last = id; save();
  toast('🎧 Фокус 25 минут. Коллеги видят, что вы работаете.', ''); paint();
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  const go_ = e.target.closest('[data-go]');
  const op = e.target.closest('[data-open]');
  const pi = e.target.closest('[data-pal]');
  if (pi) { runPal(Number(pi.dataset.pal)); return; }
  if (a) {
    const k = a.dataset.action, id = a.dataset.id;
    if (k==='overlay-bg') { if (e.target===a) closeOverlay(); return; }
    e.stopPropagation();
    switch (k) {
      case 'open-nav': document.body.classList.add('nav-open'); break;
      case 'close-nav': document.body.classList.remove('nav-open'); break;
      case 'palette': palette(); break;
      case 'capture': capture(); break;
      case 'settings': settings(); break;
      case 'close-overlay': closeOverlay(); break;
      case 'close-drawer': closeDrawer(); break;
      case 'toggle-done': { const t = task(id); const r = a.getBoundingClientRect(); setStatus(id, t.status==='done'?'todo':'done', r.left+11, r.top+11); break; }
      case 'set-status': { const r = a.getBoundingClientRect(); setStatus(id, a.dataset.s, r.left+r.width/2, r.top); break; }
      case 'toggle-top': { const i = S.top3.indexOf(id); if (i>=0) S.top3.splice(i,1); else { if (S.top3.length>=3) { toast('В «Моём дне» максимум 3 задачи. Сначала закрой или убери одну.'); break; } S.top3.push(id); } save(); paint(); paintDrawer(); break; }
      case 'sub': { const t = task(id); const s = t.sub[a.dataset.i]; s[1] = a.checked; save(); if (s[1]) gain(2, '☑ Шаг выполнен'); paint(); paintDrawer(); return; }
      case 'check': { const c = S.checks[a.dataset.key] = S.checks[a.dataset.key] || []; c[a.dataset.i] = a.checked; save(); if (a.checked) gain(2,'☑ Отмечено'); paint(); return; }
      case 'vote': { const d = dec(id); const i = Number(a.dataset.i); const first = d.votes.me==null; if (d.votes.me===i) delete d.votes.me; else d.votes.me = i; addLog(`проголосовал(а) в решении <q>${esc(d.q)}</q>`, d.dept); if (first && d.votes.me!=null) gain(5,'🗳 Голос учтён'); else save(); paint(); break; }
      case 'accept': { const d = dec(id); if (!confirm('Зафиксировать «'+d.options[a.dataset.i][0]+'» как итог?')) break; d.chosen = Number(a.dataset.i); addLog(`принял(а) решение <q>${esc(d.q)}</q>`, d.dept); const r = a.getBoundingClientRect(); confetti(r.left, r.top); gain(10,'⚖️ Решение принято'); paint(); break; }
      case 'new-task': newTask(a.dataset.status, a.dataset.dept, a.dataset.title); break;
      case 'filt-dept': return;
      case 'filt-small': UI.filt.small = !UI.filt.small; paint(); break;
      case 'filt-mine': UI.filt.mine = !UI.filt.mine; paint(); break;
      case 'inbox-del': S.inbox = S.inbox.filter(i=>i.id!==id); save(); toast('🗑 Удалено'); paint(); break;
      case 'inbox-task': { const it = S.inbox.find(i=>i.id===id); S.inbox = S.inbox.filter(i=>i.id!==id); const tid = 't'+Date.now();
        S.tasks.push({id:tid, title:it.text, tldr:'', details:'', dept:it.dept||'dev', status:'inbox', size:'M', who:'me', links:[], sub:[], comments:[]}); gain(3,'→ Превращено в задачу'); paint(); openDrawer('task:'+tid); break; }
      case 'pick-dept': { const f = a.closest('form'); const was = a.getAttribute('aria-pressed')==='true'; f.querySelectorAll('[data-action="pick-dept"]').forEach(b=>b.setAttribute('aria-pressed','false')); if (!was) a.setAttribute('aria-pressed','true'); f.d.value = was?'':a.dataset.d; f.t.focus(); break; }
      case 'pick-size': { const f = a.closest('form'); f.querySelectorAll('[data-action="pick-size"]').forEach(b=>b.setAttribute('aria-pressed', String(b===a))); f.size.value = a.dataset.v; break; }
      case 'pref': { let v = a.dataset.v; if (v==='true') v = true; if (v==='false') v = false; S.prefs[a.dataset.k] = v; applyPrefs(); save(); settings(); break; }
      case 'toggle-dept': { const h = S.prefs.hidden; const i = h.indexOf(a.dataset.d); if (i>=0) h.splice(i,1); else h.push(a.dataset.d); save(); settings(); paint(); break; }
      case 'focus-start': startFocus(id); break;
      case 'focus-stop': S.focus = null; save(); toast('Фокус остановлен'); paint(); break;
      case 'reset': if (confirm('Вернуть тестовые данные?')) { S = fresh(); save(); applyPrefs(); paint(); } break;
    }
    return;
  }
  if (go_) { e.stopPropagation(); go(go_.dataset.go); return; }
  if (op) { openDrawer(op.dataset.open); return; }
});
document.addEventListener('change', e => { if (e.target.dataset.action==='filt-dept') { UI.filt.dept = e.target.value; paint(); } });
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form==='capture') { const t = f.t.value.trim(); if (!t) return; S.inbox.unshift({id:'i'+Date.now(), text:t, at:Date.now(), by:'me', dept:f.d.value||null}); closeOverlay(); gain(2,'💭 Записано во «Входящие»'); paint(); }
  if (f.dataset.form==='task') createTask(f);
  if (f.dataset.form==='comment') { const t = f.c.value.trim(); if (!t) return; const tk = task(f.dataset.id); tk.comments.push(['me', t, Date.now()]); addLog(`прокомментировал(а) <q>${esc(tk.title)}</q>`, tk.dept); gain(3,'💬 Комментарий добавлен'); paintDrawer(); paint(); }
});
document.addEventListener('input', e => { if (e.target.id==='pal-in') { UI.pal.q = e.target.value; UI.pal.items = palItems(e.target.value); UI.pal.i = 0; paintPal(); } });
document.addEventListener('keydown', e => {
  if (e.key==='Enter' && e.target.matches('[data-go]:not(button),[data-open]:not(button)')) { e.preventDefault(); e.target.click(); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k') { e.preventDefault(); UI.pal ? closeOverlay() : palette(); return; }
  if (e.key==='Escape') { if ($('#overlay').innerHTML) closeOverlay(); else if (UI.drawer) closeDrawer(); else document.body.classList.remove('nav-open'); return; }
  if (UI.pal) {
    if (e.key==='ArrowDown') { e.preventDefault(); UI.pal.i = Math.min(UI.pal.items.length-1, UI.pal.i+1); paintPal(); }
    if (e.key==='ArrowUp') { e.preventDefault(); UI.pal.i = Math.max(0, UI.pal.i-1); paintPal(); }
    if (e.key==='Enter') { e.preventDefault(); runPal(UI.pal.i); }
    return;
  }
  if (e.target.name==='t' && e.key==='Enter' && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); return; }
  if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key==='q' || e.key==='й')) { e.preventDefault(); capture(); }
});

/* перетаскивание карточек между колонками */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragend', e => { document.querySelectorAll('.dragging,.drop').forEach(x=>x.classList.remove('dragging','drop')); dragId = null; });
document.addEventListener('dragover', e => { const col = e.target.closest('.colm'); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.drop').forEach(x=>x!==col&&x.classList.remove('drop')); col.classList.add('drop'); });
document.addEventListener('drop', e => { const col = e.target.closest('.colm'); if (!col || !dragId) return; e.preventDefault(); setStatus(dragId, col.dataset.col, e.clientX, e.clientY); });

/* ── отрисовка ──────────────────────────────── */
function view(){
  const r = UI.route;
  if (r==='today') return viewToday();
  if (r==='tasks') return viewTasks();
  if (r==='decisions') return viewDecisions();
  if (r==='inbox') return viewInbox();
  if (r==='log') return viewLog();
  if (r==='people') return viewPeople();
  if (r==='wiki') return viewWiki();
  if (r.startsWith('d/')) return viewDept();
  return viewToday();
}
function paint(){
  $('#side').innerHTML = sidebar();
  $('#topbar').innerHTML = topbar();
  $('#view').innerHTML = view();
}
/* таймеры фокуса тикают без полной перерисовки */
setInterval(() => {
  if (S.focus && S.focus.until <= Date.now()) { const t = task(S.focus.task); S.focus = null; gain(15, '🎧 25 минут фокуса позади! Сделай перерыв.' ); confetti(innerWidth-120, 40); paint(); return; }
  const fl = $('#focus-left'); if (fl && S.focus) fl.textContent = mmss(S.focus.until-Date.now());
  document.querySelectorAll('[data-until]').forEach(el => el.textContent = mmss(Number(el.dataset.until)-Date.now()));
}, 1000);

readHash(); applyPrefs(); paint();
})();
</script>
</body>
